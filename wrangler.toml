name = "hive-ui"
main = "workers/gateway/index.ts"
compatibility_date = "2026-08-12"
preview_urls = false
keep_vars = true

[[routes]]
pattern = "hive.jonathan-harris.online"
custom_domain = true

[vars]
HIVE_API_BASE_URL = "https://liable-loreen-jonathanharris-57884580.koyeb.app"
HIVE_API_TIMEOUT_MS = "10000"
HIVE_COMMS_ACTOR = "hive-owner"
HIVE_COMMS_ROLE = "admin"
HIVE_COMMS_URL = "https://chat.jonathan-harris.online/console/"
HIVE_UI_IDLE_TIMEOUT_SECONDS = "1800"
HIVE_UI_SESSION_TTL_SECONDS = "43200"
KOYEB_SERVICE_ID_AIMS = "5102061c-a0d2-4195-84d3-0f75b8b8eaa2"
KOYEB_SERVICE_ID_HIVE = "fafd45aa-a95f-4356-9faf-24b42c6dd847"
VITE_APP_NAME = "HIVE"
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "LOGIN_RATE_LIMITER"
class_name = "LoginRateLimiter"

[[migrations]]
tag = "login-rate-limiter-v1"
new_sqlite_classes = ["LoginRateLimiter"]

