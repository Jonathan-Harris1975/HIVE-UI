name = "hive-ui"
main = "workers/gateway/index.ts"
compatibility_date = "2026-08-12"
preview_urls = false
keep_vars = true

[[routes]]
pattern = "hive.jonathan-harris.online"
custom_domain = true

[vars]
HIVE_API_BASE_URL = "https://liable-loreen-jonathanharris-57884580.koyeb.app"
HIVE_UI_SESSION_TTL_SECONDS = "43200"
HIVE_UI_IDLE_TIMEOUT_SECONDS = "1800"
HIVE_COMMS_ACTOR = "hive-owner"
HIVE_COMMS_ROLE = "admin"
HIVE_COMMS_URL = "https://chat.jonathan-harris.online/console/"
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "LOGIN_RATE_LIMITER"
class_name = "LoginRateLimiter"

[[migrations]]
tag = "login-rate-limiter-v1"
new_sqlite_classes = ["LoginRateLimiter"]

# Configure these as encrypted Cloudflare Worker secrets, never in this file:
# HIVE_ADMIN_TOKEN
# HIVE_UI_ACCESS_KEY
# HIVE_UI_SESSION_SECRET (optional; recommended for independent session-key rotation)
# KOYEB_TOKEN
# KOYEB_SERVICE_ID_HIVE (normal variable in Cloudflare dashboard)
# KOYEB_SERVICE_ID_AIMS (normal variable in Cloudflare dashboard)
# HIVE_COMMS_HANDOFF_SECRET (optional; recommended for independent handoff-key rotation)
