name: Security and repository quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hive-security-${{ github.ref }}
  cancel-in-progress: true

env:
  SCORECARD_VERSION: '5.5.0'

jobs:
  repository_security:
    name: Trivy, Gitleaks and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify branch PR safety and idempotency
        run: python3 .github/scripts/test_branch_pr_automation.py
      - name: Verify autonomy lifecycle regressions
        run: python3 .github/scripts/test_autonomy_lifecycle.py
      - name: Install pinned CI tools
        run: python scripts/install_ci_tools.py trivy gitleaks actionlint
      - name: Trivy filesystem vulnerability and misconfiguration scan
        run: >-
          .ci-tools/bin/trivy fs .
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          --no-progress
      - name: Verify pinned Gitleaks detector is functional
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          # Assemble a synthetic PAT only at runtime so the repository itself
          # never contains a token-shaped fixture. The detector must reject it.
          # The body must not contain a default-config stopword (for example the
          # sequential alphabet), otherwise Gitleaks correctly allowlists it.
          printf 'token = "ghp_%s"\n' 'Zq7mK2vXr9Tn4Bw8Ls6Pd3Gc5Yh1Jf0Ua2Ex' > "$fixture/known-secret.txt"
          set +e
          .ci-tools/bin/gitleaks dir "$fixture" --redact --no-banner --exit-code 10 >/dev/null 2>&1
          status=$?
          set -e
          test "$status" -eq 10 || { echo "::error::Pinned Gitleaks detector failed its synthetic-secret self-test (exit $status)."; exit 1; }
      - name: Gitleaks full-history secret scan
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .ci-tools/bin/gitleaks git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 10
          status=$?
          set -e
          case "$status" in
            0)  echo 'result=clean' >> "$GITHUB_OUTPUT" ;;
            10) echo 'result=findings' >> "$GITHUB_OUTPUT" ;;
            *)  echo "::error::Gitleaks scanner error (exit $status). This is not a secret finding."; exit "$status" ;;
          esac
      - name: Upload redacted Gitleaks diagnostic report
        if: steps.gitleaks.outputs.result == 'findings'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-redacted-diagnostic-${{ github.run_id }}
          path: gitleaks-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Gitleaks findings
        if: steps.gitleaks.outputs.result == 'findings'
        run: |
          echo 'Gitleaks detected potential secrets. Download the redacted diagnostic artifact for rule, file, commit, line and fingerprint metadata.' >&2
          exit 1
      - name: Validate GitHub Actions workflows
        run: .ci-tools/bin/actionlint -color

  link_integrity:
    name: Lychee link integrity
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Lychee
        continue-on-error: true
        run: python scripts/install_ci_tools.py lychee
      - name: Check repository links
        continue-on-error: true
        run: >-
          .ci-tools/bin/lychee
          --no-progress
          --cache
          --max-retries 2
          --timeout 20
          README.md SECURITY.md docs

  scorecard:
    name: OpenSSF Scorecard
    continue-on-error: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Install pinned Scorecard CLI from source
        continue-on-error: true
        env:
          GOBIN: ${{ runner.temp }}/scorecard-bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install "github.com/ossf/scorecard/v5@v${SCORECARD_VERSION}"
          "$GOBIN/scorecard" version
      - name: Run OpenSSF Scorecard
        continue-on-error: true
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORECARD_BIN: ${{ runner.temp }}/scorecard-bin/scorecard
        run: |
          set -euo pipefail
          "$SCORECARD_BIN" --repo="github.com/${GITHUB_REPOSITORY}" --format=json --show-details > scorecard.json
          cat scorecard.json

