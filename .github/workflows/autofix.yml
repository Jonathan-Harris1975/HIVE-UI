name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.actor != 'autofix-ci[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install repository-pinned npm and locked dependencies
        run: |
          npm ci --prefix .github/ci-toolchain --ignore-scripts --no-audit --no-fund
          export PATH="$GITHUB_WORKSPACE/.github/ci-toolchain/node_modules/.bin:$PATH"
          npm ci --no-audit --no-fund
      - name: Apply repository-native ESLint fixes
        run: |
          export PATH="$GITHUB_WORKSPACE/.github/ci-toolchain/node_modules/.bin:$PATH"
          npm run lint -- --fix
      - name: Submit autofix patch
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        with:
          fail-fast: false
