name: HIVE-UI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hive-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Reject committed literal secrets
        run: python3 scripts/secret_scan.py

      - name: Install repository-pinned npm
        run: npm install --global npm@10.9.9

      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "10.9.9"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, lint, build and verify
        run: npm run check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

      - name: Enforce production bundle size budget
        run: npm run check:bundle-budget

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Package production bundle for provenance
        run: tar -C dist -czf "hive-ui-dist-${GITHUB_SHA}.tar.gz" .

      - name: Generate production bundle SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: hive-ui.sbom.spdx.json
          upload-artifact: false

      - name: Attest production bundle provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: hive-ui-dist-${{ github.sha }}.tar.gz

      - name: Attest production bundle SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: hive-ui-dist-${{ github.sha }}.tar.gz
          sbom-path: hive-ui.sbom.spdx.json

      - name: Retain supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-ui-supply-chain-${{ github.sha }}
          path: |
            hive-ui-dist-${{ github.sha }}.tar.gz
            hive-ui.sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hive-ui-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Playwright end-to-end
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install repository-pinned npm
        run: npm install --global npm@10.9.9

      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "10.9.9"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright e2e suite
        run: npm run test:e2e
        # To run this against a real Cloudflare Worker preview deployment
        # instead of a local preview server, set HIVE_UI_E2E_BASE_URL to
        # that deployment's URL (e.g. via a repository variable populated
        # by the Cloudflare Worker deploy step for this PR).
        env:
          HIVE_UI_E2E_BASE_URL: ''

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          retention-days: 14

  notify_failure:
    name: Notify central operations on CI failure
    needs: [verify, e2e]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      - name: Send redacted HIVE operational event
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_WEBHOOK_TOKEN: ${{ secrets.OPS_ALERT_WEBHOOK_TOKEN }}
        run: >-
          python scripts/ops_notify.py
          --service HIVE-UI
          --event-type ci_failed
          --title "HIVE-UI GitHub Actions failed"
          --summary "The governed CI workflow failed. Open the linked run for the failing job and logs."
          --event-id "github:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"
          --release-id "${{ github.sha }}"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_gate:
    name: Release gate (exact SHA)
    needs: [verify, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Require all release checks to be green
        env:
          RESULT_VERIFY: ${{ needs.verify.result }}
          RESULT_E2E: ${{ needs.e2e.result }}
        run: |
          test "$RESULT_VERIFY" = "success"
          test "$RESULT_E2E" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      - name: Assert checked-out commit is the workflow SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"green"}\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > release-attestation.json
      - name: Retain exact-SHA release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation-${{ github.sha }}
          path: release-attestation.json
          retention-days: 90

  autonomous_repair_guard:
    name: Autonomous repair marker gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        with:
          fetch-depth: 0
      - name: Require autonomous repair request to be resolved
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          # Fork PR commits may be absent even with a full checkout.
          for sha in "$base_sha" "$head_sha"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
          merge_base="$(git merge-base "$base_sha" "$head_sha")"
          changed_markers="$(git diff --name-only --diff-filter=AMR "$merge_base" "$head_sha" -- '.autonomy/repair-request-*.md' '.autonomy/repair-requests/*.md')"
          if [ -n "$changed_markers" ]; then
            echo "::error::This PR introduces an unresolved autonomous repair request. Fix the underlying failure, then remove the repair-request marker."
            printf '%s\n' "$changed_markers"
            exit 1
          fi

  ci_gate:
    name: ci-gate
    needs: [release_gate, autonomous_repair_guard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Enforce aggregate CI result
        env:
          RELEASE_GATE_RESULT: ${{ needs.release_gate.result }}
          REPAIR_GUARD_RESULT: ${{ needs.autonomous_repair_guard.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_GATE_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$REPAIR_GUARD_RESULT" = "success"
          fi
