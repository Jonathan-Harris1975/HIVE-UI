name: DAST penetration test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.repository }}
  cancel-in-progress: false

env:
  DAST_ENABLED: ${{ vars.DAST_ENABLED || 'false' }}
  DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL || '' }}

jobs:
  zap-full-scan:
    name: OWASP ZAP full active scan
    if: ${{ vars.DAST_ENABLED == 'true' && vars.DAST_TARGET_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Refuse unauthorised/non-HTTPS remote target
        shell: bash
        run: |
          set -euo pipefail
          case "$DAST_TARGET_URL" in https://*) ;; *) echo "::error::DAST_TARGET_URL must be an authorised HTTPS endpoint."; exit 1;; esac

      - name: Run authorised ZAP full scan
        id: scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: dast-zap-full-${{ github.run_id }}

      - name: Build exact-run DAST evidence
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r2-evidence/dast
          jq -n             --arg repository "$REPOSITORY"             --arg sha "$TARGET_SHA"             --arg run_id "$RUN_ID"             --arg run_attempt "$RUN_ATTEMPT"             --arg scan_outcome "$SCAN_OUTCOME"             '{
              kind:"dast",
              repository:$repository,
              default_sha:$sha,
              workflow_run_id:$run_id,
              workflow_run_attempt:$run_attempt,
              scan_outcome:$scan_outcome,
              target_configured:true
            }' > .r2-evidence/dast/evidence.json
          while IFS= read -r -d '' report; do
            cp "$report" ".r2-evidence/dast/$(basename "$report")"
          done < <(
            find . -type f               ! -path './.r2-evidence/*'               \( -name 'report_*.html' -o -name 'report_*.json' -o -name 'report_*.md' -o -name 'zap*.log' \)               -print0
          )

      - name: Persist DAST evidence to hive-repositories R2
        if: always()
        env:
          R2_ENDPOINT_URL: ${{ vars.CF_R2_ENDPOINT_URL || vars.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: hive-repositories
        shell: bash
        run: bash .github/scripts/persist_r2_evidence.sh dast "${{ github.sha }}" .r2-evidence/dast
