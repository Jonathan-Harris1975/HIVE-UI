name: HIVE-UI deployed integration

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] exact-main successful same-repository CI gate
    workflows: ["HIVE-UI CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed commit SHA to require
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hive-ui-deployed-integration
  cancel-in-progress: false

jobs:
  integration:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate explicitly requested deployment SHA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' }}
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::expected_sha must be a full 40-character lowercase hexadecimal Git commit SHA.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install repository-pinned npm
        run: npm install --global npm@10.9.9

      - name: Verify pinned Node/npm toolchain
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "10.9.9"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the exact Worker release
        env:
          HIVE_UI_E2E_BASE_URL: ${{ vars.HIVE_UI_E2E_BASE_URL || 'https://hive.jonathan-harris.online' }}
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          expected="$EXPECTED_DEPLOYMENT_SHA"
          for _ in $(seq 1 45); do
            body="$(curl --fail --silent --show-error --connect-timeout 3 --max-time 8 "${HIVE_UI_E2E_BASE_URL%/}/health" || true)"
            deployed="$(printf '%s' "$body" | jq -r '.source_sha // empty' 2>/dev/null || true)"
            if [ "$deployed" = "$expected" ]; then
              printf 'Exact HIVE-UI release %s is live\n' "$deployed"
              exit 0
            fi
            sleep 10
          done
          echo "Expected HIVE-UI release $expected did not become live" >&2
          exit 1
      - name: Verify exact deployed Worker, authentication and upstream proxies
        env:
          HIVE_UI_E2E_BASE_URL: ${{ vars.HIVE_UI_E2E_BASE_URL || 'https://hive.jonathan-harris.online' }}
          HIVE_UI_E2E_ACCESS_KEY: ${{ secrets.HIVE_UI_ACCESS_KEY }}
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          test -n "${HIVE_UI_E2E_ACCESS_KEY:-}" || { echo "HIVE_UI_ACCESS_KEY is required" >&2; exit 1; }
          npm run test:e2e -- --grep "HIVE-UI deployed gateway"
      - name: Record deployed-integration attestation
        env:
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf '{"repository":"%s","sha":"%s","workflow_run":"%s","status":"deployed-integration-green"}\n' \
            "$GITHUB_REPOSITORY" "$EXPECTED_DEPLOYMENT_SHA" "$GITHUB_RUN_ID" > deployed-integration-attestation.json
      - name: Retain deployed-integration attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployed-integration-attestation-${{ inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
          path: deployed-integration-attestation.json
          retention-days: 90
